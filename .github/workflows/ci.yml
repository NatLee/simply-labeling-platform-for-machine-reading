name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/api
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test (fake model servers, no API key needed)
        run: cargo test --locked

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Type-check and build
        run: pnpm build

  docker:
    name: Docker image
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mrc-label:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name mrc -p 8787:8787 mrc-label:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/api/meta | tee meta.json
          grep -q '"enabled":false' meta.json
          curl -fsS http://127.0.0.1:8787/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8787/p/1/annotate | grep -q '<div id="root">'
          # 匯入範例資料集再匯出，確認整條路通
          id=$(curl -fsS -H 'content-type: application/json' -d '{"name":"ci"}' http://127.0.0.1:8787/api/projects | sed -n 's/.*"id":\([0-9]*\).*/\1/p')
          curl -fsS --data-binary @docs/examples/sample-squad-v2.json -H 'content-type: application/octet-stream' \
            "http://127.0.0.1:8787/api/projects/$id/import" | tee import.json
          grep -q '"questions_created":6' import.json
          curl -fsS "http://127.0.0.1:8787/api/projects/$id/export?format=jsonl" | tee export.jsonl
          test "$(wc -l < export.jsonl)" -eq 6
          # 舊版 Flask 的 API 還在
          curl -fsS http://127.0.0.1:8787/article | grep -q article_id
          docker logs mrc
      - name: Smoke test with login turned on
        run: |
          # 每次跑都用新的隨機密碼，不放任何固定密碼在 repo 裡
          pw=$(openssl rand -hex 16)
          docker run -d --name mrc-login -p 8788:8787 -e ADMIN_PASSWORD="$pw" mrc-label:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8788/api/health && break
            sleep 1
          done
          # 沒登入：API 和舊版 API 都回 401，前端檔案照常
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8788/api/projects)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8788/article)" = 401
          curl -fsS http://127.0.0.1:8788/ | grep -q '<div id="root">'
          # 登入後可以用，cookie 是 HttpOnly
          curl -fsS -c jar.txt -D login-headers.txt -H 'content-type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$pw\"}" http://127.0.0.1:8788/api/auth/login
          grep -qi 'set-cookie: mrc_session=.*HttpOnly' login-headers.txt
          curl -fsS -b jar.txt http://127.0.0.1:8788/api/projects
          # 別的網站送來的寫入被擋下
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt -H 'Origin: https://evil.example' \
            -H 'content-type: application/json' -d '{"name":"x"}' http://127.0.0.1:8788/api/projects)" = 403
          if docker logs mrc-login 2>&1 | grep -q "$pw"; then echo "password leaked into logs"; exit 1; fi
          docker logs mrc-login
